name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Criar projeto
        run: |
          mkdir -p "$(dirname 'settings.gradle.kts')"
          cat > 'settings.gradle.kts' <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Assistente"
          include(":app")
          EOF_FILE
          mkdir -p "$(dirname 'build.gradle.kts')"
          cat > 'build.gradle.kts' <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF_FILE
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.keter.assistente"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.keter.assistente"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application android:label="Assistente" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".VoiceActivity" android:exported="false"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar" />
                  <service android:name=".AssistantService" android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="assistente pessoal acessivel por notificacao" />
                  </service>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/java/com/keter/assistente/MainActivity.kt')"
          cat > 'app/src/main/java/com/keter/assistente/MainActivity.kt' <<'EOF_FILE'
          package com.keter.assistente

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 120, 48, 48)
                  }
                  val info = TextView(this).apply {
                      text = "Assistente pessoal\n\nToque em Ativar. Uma notificacao fica fixa com o botao Falar. " +
                          "Exemplos: \"youtube musica relaxante\", \"waze shopping\", \"maps farmacia\", \"ir para rodoviaria\"."
                      textSize = 18f
                  }
                  val ativar = Button(this).apply { text = "Ativar assistente"; setOnClickListener { ativar() } }
                  val falar = Button(this).apply {
                      text = "Falar agora"
                      setOnClickListener { startActivity(Intent(this@MainActivity, VoiceActivity::class.java)) }
                  }
                  val desativar = Button(this).apply {
                      text = "Desativar"
                      setOnClickListener { stopService(Intent(this@MainActivity, AssistantService::class.java)) }
                  }
                  val lp = ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  layout.addView(info, lp); layout.addView(ativar, lp); layout.addView(falar, lp); layout.addView(desativar, lp)
                  setContentView(layout)
              }

              private fun ativar() {
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  } else {
                      startForegroundService(Intent(this, AssistantService::class.java))
                  }
              }

              override fun onRequestPermissionsResult(code: Int, perms: Array<out String>, results: IntArray) {
                  super.onRequestPermissionsResult(code, perms, results)
                  startForegroundService(Intent(this, AssistantService::class.java))
              }
          }
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/java/com/keter/assistente/AssistantService.kt')"
          cat > 'app/src/main/java/com/keter/assistente/AssistantService.kt' <<'EOF_FILE'
          package com.keter.assistente

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder

          class AssistantService : Service() {
              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val channel = "assistente"
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel(channel, "Assistente", NotificationManager.IMPORTANCE_LOW))
                  val pi = PendingIntent.getActivity(
                      this, 0,
                      Intent(this, VoiceActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val notification = Notification.Builder(this, channel)
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentTitle("Assistente ativo")
                      .setContentText("Toque para falar")
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(1, notification)
                  }
                  return START_STICKY
              }
          }
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/java/com/keter/assistente/VoiceActivity.kt')"
          cat > 'app/src/main/java/com/keter/assistente/VoiceActivity.kt' <<'EOF_FILE'
          package com.keter.assistente

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.speech.RecognizerIntent
          import android.widget.Toast

          class VoiceActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE, "pt-BR")
                      .putExtra(RecognizerIntent.EXTRA_PROMPT, "Fale o comando")
                  try {
                      startActivityForResult(i, 1)
                  } catch (e: Exception) {
                      Toast.makeText(this, "Reconhecimento de voz indisponivel neste aparelho", Toast.LENGTH_LONG).show()
                      finish()
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (resultCode == RESULT_OK) {
                      val said = data?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)?.firstOrNull()
                      if (said != null) Commands.run(this, said)
                  }
                  finish()
              }
          }
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/java/com/keter/assistente/Commands.kt')"
          cat > 'app/src/main/java/com/keter/assistente/Commands.kt' <<'EOF_FILE'
          package com.keter.assistente

          import android.content.ActivityNotFoundException
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.widget.Toast
          import java.util.Locale

          object Commands {
              private val filler = Regex("^(abrir|abre|ir|vai|toca|tocar|procurar|pesquisar|buscar|no|na|o|a|para|pra|pro|de|do|da|por favor)\\s+")

              private fun clean(s: String): String {
                  var r = s.trim()
                  while (true) {
                      val n = filler.replace(r, "").trim()
                      if (n == r) break
                      r = n
                  }
                  return r
              }

              private fun open(ctx: Context, uri: String): Boolean =
                  try {
                      ctx.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(uri)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      true
                  } catch (e: ActivityNotFoundException) {
                      false
                  }

              fun run(ctx: Context, said: String) {
                  val t = said.lowercase(Locale("pt", "BR")).trim()
                  when {
                      t.contains("waze") -> {
                          val q = clean(t.replace("waze", ""))
                          val ok = if (q.isEmpty()) open(ctx, "waze://") else open(ctx, "waze://?q=" + Uri.encode(q) + "&navigate=yes")
                          if (!ok && q.isNotEmpty()) open(ctx, "google.navigation:q=" + Uri.encode(q))
                      }
                      t.contains("youtube") || t.contains("you tube") -> {
                          val q = clean(t.replace("youtube", "").replace("you tube", ""))
                          open(ctx, if (q.isEmpty()) "https://www.youtube.com" else "https://www.youtube.com/results?search_query=" + Uri.encode(q))
                      }
                      t.contains("maps") || t.contains("mapa") -> {
                          val q = clean(t.replace("google maps", "").replace("maps", "").replace("mapa", ""))
                          open(ctx, if (q.isEmpty()) "geo:0,0" else "geo:0,0?q=" + Uri.encode(q))
                      }
                      Regex("^(ir|vai|navegar|rota|me leve|levar)\\b.*").matches(t) -> {
                          val q = clean(t.replace(Regex("^(me leve|levar|navegar|rota|vai|ir)"), ""))
                          open(ctx, "google.navigation:q=" + Uri.encode(q))
                      }
                      else -> Toast.makeText(ctx, "Nao entendi: " + said, Toast.LENGTH_LONG).show()
                  }
              }
          }
          EOF_FILE
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Assistente v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
